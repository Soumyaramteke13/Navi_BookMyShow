<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMS Booking Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#f84464; --red-dark:#dc3545; --green:#1ea83c; --green-dark:#0f7a2a;
  --ink:#222; --ink2:#666; --ink3:#999; --line:#e5e5e5; --bg:#f2f5f9;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Roboto,system-ui,sans-serif;background:#d9dde3;color:var(--ink);display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;padding-bottom:64px}
#tabs{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;background:#fff;border-radius:30px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:100}
#tabs button{padding:10px 22px;border-radius:26px;font-size:14px;font-weight:500;color:#555;white-space:nowrap}
#tabs button.on{background:var(--red);color:#fff}
#tabs{max-width:calc(100vw - 24px);width:max-content;flex-wrap:wrap;justify-content:center;border-radius:22px}
#tabs button{padding:9px 16px;font-size:13.5px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
#phone{flex:none;transform-origin:center center;position:relative;width:390px;height:844px;background:#fff;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25),0 0 0 10px #111;display:flex;flex-direction:column}
@media (max-width:500px){body{background:#fff;padding-bottom:58px;align-items:flex-start}#phone{width:100vw;height:calc(100dvh - 58px);border-radius:0;box-shadow:none}#tabs{bottom:6px}}
.status{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:500;background:#fff;z-index:5}
.status .ic{display:flex;gap:6px;align-items:center;font-size:12px}
#app{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.homebar{height:18px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;z-index:5}
.homebar i{width:120px;height:4px;border-radius:4px;background:#666}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.screen.enter{animation:in .22s ease}
@keyframes in{from{opacity:.4;transform:translateX(14px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:0;height:0}
.hdr{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;flex:none}
.hdr h1{font-size:19px;font-weight:500;flex:1}
.hdr .sub{font-size:13px;color:var(--ink2);margin-top:2px;font-weight:400}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.ibtn:active{background:#eee}
svg{display:block}

/* ---------- showtimes ---------- */
.dates{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;width:64px;padding:8px 0;text-align:center;color:#333}
.date small{display:block;font-size:11px;letter-spacing:.5px}
.date b{display:block;font-size:20px;font-weight:500;margin:3px 0}
.date.off{color:#bbb}
.date.on{background:var(--red);color:#fff}
.langrow{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--line);flex:none}
.chips{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;box-shadow:0 3px 6px rgba(0,0,0,.06);flex:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--red);color:var(--red-dark);border-radius:20px;padding:7px 14px;font-size:13px}
.chip.sort{border-color:#bbb;color:#333;border-radius:8px;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--red);color:#fff}
.vsep{width:1px;height:26px;background:#ddd;flex:none}
.list{background:var(--bg);padding:12px}
.cin{background:#fff;padding:14px 14px 16px;border-bottom:1px solid #eee}
.cin-top{display:flex;gap:10px;align-items:flex-start}
.logo{width:42px;height:42px;border:1px solid #eee;border-radius:6px;display:grid;place-items:center;font-size:8px;font-weight:700;flex:none}
.logo.cine{color:#0a4fa3;font-size:8.5px}.logo.inox{color:#003c8f;font-size:11px}.logo.pvr{color:#e9b600;font-size:14px}
.cin h3{font-size:15px;font-weight:500;line-height:1.3;flex:1}
.heart{padding:2px}
.cin .canc{font-size:12px;color:var(--ink2);margin:8px 0 10px}
.times{display:flex;flex-wrap:wrap;gap:10px}
.time{position:relative;min-width:120px;border:1px solid var(--green);border-left-width:4px;border-radius:4px;padding:9px 10px;text-align:center;font-size:14px;color:#333}
.time small{display:block;font-size:9px;color:#555;margin-top:2px;letter-spacing:.3px}
.time .moon{position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;background:#777;display:grid;place-items:center}
.time:active{background:#eaf7ee}
.tip{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:#555;background:#fff}
.tip span{flex:1}
.tip .pg{font-size:12px;text-decoration:underline}
.tip .x{width:24px;height:24px;border-radius:50%;background:#e8e8e8;display:grid;place-items:center}
.empty{padding:40px 20px;text-align:center;color:var(--ink2);font-size:14px}

/* ---------- seats ---------- */
.seatbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 0;background:#eef2f7;font-size:14px;flex:none}
.seatbar .tk{color:var(--red-dark);display:flex;gap:6px;align-items:center;font-weight:500}
.showchip{background:#eef2f7;padding:10px 16px 14px;flex:none}
.showchip span{display:inline-block;background:var(--green);color:#fff;border-radius:4px;padding:10px 32px;font-size:15px;font-weight:500}
.map{flex:1;overflow:auto;min-height:0;position:relative;background:#fff}
.map::-webkit-scrollbar{display:none}
.map-in{display:inline-block;min-width:100%;padding:12px 12px 0 0}
.srow{display:flex;align-items:center;height:30px}
.srow.cat{height:34px;align-items:flex-end;padding-bottom:4px}
.srow.sp{height:18px}
.rl{position:sticky;left:0;z-index:2;width:22px;flex:none;align-self:stretch;background:#a8a8a8;color:#fff;font-size:12px;display:grid;place-items:center;margin-right:24px}
.rl.first{border-radius:12px 12px 0 0}.rl.last{border-radius:0 0 12px 12px}
.catlbl{font-size:12px;color:#333;white-space:nowrap;border-bottom:1px solid #e3e3e3;flex:1;padding-bottom:4px;min-width:740px}
.cells{display:flex;gap:6px}
.st,.gap{width:25px;height:25px;flex:none}
.st{border:1px solid var(--green);border-radius:3px;font-size:10px;color:#555;display:grid;place-items:center;background:#fff}
.st.sold{background:#e6e6e6;border-color:#e6e6e6;color:#fff;cursor:default}
.st.sel{background:var(--green);color:#fff}
.st.wc svg{width:15px;height:15px}
.st.wc.sel svg path{fill:#fff}
.screenwrap{padding:28px 0 10px;text-align:center;min-width:760px}
.scr{width:560px;height:46px;margin:0 auto;position:relative}
.scrcap{font-size:13px;margin-top:10px;color:#333;text-align:left;padding-left:255px}
.legend{display:flex;gap:22px;justify-content:center;font-size:14px;padding:12px 0;flex:none;background:#fff}
.legend i{display:inline-block;width:20px;height:20px;border-radius:3px;vertical-align:-5px;margin-right:8px}
.offer{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#eef2f7;flex:none}
.offer .ol{width:44px;height:36px;background:#fff;display:grid;place-items:center;border-radius:4px}
.offer span{flex:1;font-size:13px}
.offer .cnt{text-align:right;font-weight:500;font-size:14px}
.dots{display:flex;gap:3px;margin-top:6px}.dots i{width:18px;height:4px;border-radius:3px;background:#ccc}.dots i.on{background:#333}
.cta-wrap{padding:10px 18px 8px;background:#fff;flex:none}
.cta{width:100%;background:var(--red);color:#fff;font-size:18px;padding:14px;border-radius:8px;box-shadow:0 2px 6px rgba(248,68,100,.3)}
.cta:active{filter:brightness(.92)}

/* ---------- overlays ---------- */
#ov{position:absolute;inset:0;z-index:20;pointer-events:none}
#ov.show{pointer-events:auto}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;animation:up .25s ease;padding-bottom:18px}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:110px;height:5px;border-radius:4px;background:#ddd;margin:10px auto 0}
.sheet h2{text-align:center;font-size:20px;font-weight:500;margin:30px 0 10px;letter-spacing:.3px}
.veh{height:150px;display:grid;place-items:center;font-size:92px}
.veh span{animation:pop .25s ease}
@keyframes pop{from{transform:scale(.7);opacity:.3}}
.nums{display:flex;justify-content:space-between;padding:12px 14px 28px;border-bottom:1px solid var(--line)}
.nums button{width:34px;height:34px;border-radius:50%;font-size:18px}
.nums button.on{background:var(--red);color:#fff;transform:scale(1.15)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 6px;padding:18px 18px 16px 50px}
.cats div{font-size:13px}.cats b{display:block;font-size:18px;font-weight:500;margin:5px 0 3px}.cats em{font-style:normal;color:var(--green);font-size:13px;font-weight:500}
.cats .r{grid-column:2}
.dialog{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);background:#fff;animation:fade .15s}
.dlg-bms h4{background:#f2f2f2;text-align:center;font-weight:400;font-size:18px;padding:18px}
.dlg-bms p{text-align:center;padding:24px 30px 36px;font-size:16px;color:#333;line-height:1.4}
.dlg-bms .row{display:flex;border-top:1px solid #ddd}
.dlg-bms .row button{flex:1;padding:18px;font-size:16px}
.dlg-bms .row button+button{border-left:1px solid #ddd}
.dlg-pay{left:42px;right:42px;border-radius:12px;padding:26px 22px 22px;text-align:center}
.dlg-pay h4{font-size:19px;font-weight:500;margin-bottom:14px}
.dlg-pay p{font-size:15px;color:#444;line-height:1.5}
.dlg-pay .yes{color:var(--red-dark);font-size:17px;font-weight:500;margin:14px 0 12px;display:block;width:100%}
.dlg-pay .no{background:var(--red-dark);color:#fff;width:100%;padding:11px;border-radius:6px;font-size:16px;font-weight:500}
.actsheet{padding:16px 0 8px}
.actsheet h5{font-size:16px;font-weight:500;padding:6px 20px 12px}
.actsheet button{display:flex;justify-content:space-between;width:100%;padding:14px 20px;font-size:15px;text-align:left}
.actsheet button.on{color:var(--red-dark);font-weight:500}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:40;white-space:nowrap;animation:fade .2s}

/* ---------- confirm ---------- */
.conf{background:var(--bg);padding:0 16px 20px}
.card{background:#fff;border-radius:10px;padding:14px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bk1{display:flex;justify-content:space-between}
.bk1 h2{font-size:21px;font-weight:500}
.bk1 .n{font-size:21px;font-weight:500}
.bk2{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-top:4px}
.mt{color:var(--red-dark);display:flex;gap:6px;align-items:center}
.muted{color:var(--ink2);font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{display:flex;justify-content:space-between;font-size:15px;color:#444;padding:8px 0}
.prow.tot{color:#111;font-weight:500;border-top:1px solid #ccc;margin-top:6px;padding-top:14px}
.feebrk{background:#fafafa;border-radius:6px;padding:4px 10px;margin-bottom:4px}
.feebrk .prow{font-size:13px;padding:5px 0}
.chev{display:inline-block;transition:transform .2s}.chev.up{transform:rotate(180deg)}
.donate{padding:0;overflow:hidden}
.donate .top{background:linear-gradient(90deg,#dbe9fb,#f7e3ec);padding:16px 14px;display:flex;justify-content:space-between;align-items:center}
.donate .top h3{font-size:26px;color:#1f6fbf;font-weight:700}
.donate .top h3 span{font-size:21px;color:#333;font-weight:400;margin-left:6px}
.donate .top a{display:block;font-size:13px;color:#1f6fbf;margin-top:2px}
.donate .tkt{font-size:40px}
.donate .bot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:14px;color:#444}
.donate .bot small{display:block;font-size:12px;text-decoration:underline;margin-top:8px}
.addbtn{border:1.5px solid var(--red-dark);color:var(--red-dark);border-radius:8px;padding:9px 14px;font-size:15px;font-weight:500}
.addbtn.on{background:var(--red-dark);color:#fff}
.contact h4{font-size:16px;font-weight:500;display:flex;justify-content:space-between}
.contact h4 button{color:var(--red-dark);font-weight:400;display:flex;gap:6px;align-items:center}
.contact p{font-size:15px;color:#555;margin-top:10px;line-height:1.5}
.offers{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:500;width:100%;text-align:left}
.offers span{flex:1}
.consent{font-size:15px;color:#333;line-height:1.4}
.foot{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:#fff;border-top:1px solid #eee;flex:none}
.foot .t small{font-size:14px;color:#555}.foot .t b{display:block;font-size:22px;font-weight:700;margin-top:2px}
.foot .cta{width:auto;flex:none;padding:13px 40px;font-size:18px}
.foot .pu{font-size:13px;color:#444;text-align:left}
.foot .pu b{display:block;font-size:17px;font-weight:500;color:#111;margin-top:3px}
.gpay{display:inline-block;border:1px solid #888;border-radius:10px;padding:0 5px;font-size:10px;margin-right:4px}

/* ---------- payment ---------- */
.amt{background:#fbf7da;display:flex;justify-content:space-between;align-items:center;padding:28px 16px 32px;position:relative;font-size:16px}
.amt b{font-size:28px;font-weight:500}
.amt:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:10px;background:radial-gradient(circle at 6px -2px,#fbf7da 7px,transparent 7.5px) repeat-x;background-size:12px 10px}
.paysec{background:#f2f2f2;padding:24px 0 0}
.paysec h6{font-size:15px;font-weight:400;color:#555;letter-spacing:.4px;padding:0 16px 14px;border-bottom:1px solid #ddd}
.popts{background:#fff}
.popt{display:flex;align-items:center;gap:20px;padding:0 0 0 16px;width:100%;text-align:left}
.popt .pi{width:34px;display:grid;place-items:center;flex:none}
.popt span{flex:1;font-size:17px;padding:20px 0;border-bottom:1px solid #e6e6e6}
.popt:last-child span{border-bottom:0}
.popt:active{background:#f6f6f6}
.paybot{background:#f2f2f2;padding:22px 16px 30px;color:#888}
.brandrow{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:30px;font-weight:700;color:#aaa;letter-spacing:-1px}
.brand span{background:#aaa;color:#f2f2f2;padding:0 4px;border-radius:3px;transform:rotate(-6deg);display:inline-block}
.seal{width:120px;height:120px;border-radius:50%;border:2px solid #ccc;display:grid;place-items:center;font-size:9px;text-align:center;color:#aaa;letter-spacing:1px}
.seal i{width:44px;height:44px;border-radius:50%;background:#ddd;display:grid;place-items:center;margin:4px auto}
.paybot h6{font-size:15px;font-weight:400;margin:18px 0 8px}
.paybot ol{padding-left:20px;font-size:14px;line-height:1.5}
.paybot ol li{margin-bottom:10px}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.badges span{font-size:10px;font-weight:700;color:#777;background:#fff;border-radius:4px;padding:6px 7px}

/* ---------- upi ---------- */
.upilist{background:var(--bg);flex:1;padding:12px 16px}
.upilist .card{padding:0 14px;margin:0}
.upi{display:flex;align-items:center;gap:20px;width:100%;padding:12px 0;text-align:left;border-bottom:1px solid #eee;font-size:17px}
.upi:last-child{border:0}
.upi .ul{width:56px;height:46px;border:1px solid #ddd;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.upi span{flex:1}

/* ---------- processing ---------- */
.proc{flex:1;background:var(--bg);padding:16px 16px;display:flex;flex-direction:column}
.warn{background:#fff3cd;border-radius:8px;padding:10px 14px;text-align:center;font-size:14px;line-height:1.45;color:#333}
.pwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px 80px}
.bar{height:6px;background:#dcdfe5;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:6px;transition:width .1s linear}
.pct{text-align:right;font-size:13px;color:#777;margin-top:8px}
.proc h3{text-align:center;font-size:20px;font-weight:500;margin-top:36px}
.proc p{text-align:center;font-size:15px;color:#555;margin-top:10px;line-height:1.5}

/* ---------- ticket ---------- */
.tkscreen{flex:1;background:#3b3b3b;overflow-y:auto;padding:0 20px 30px;position:relative}
.tkscreen::-webkit-scrollbar{display:none}
.tkhead{display:flex;align-items:center;justify-content:center;gap:8px;color:#222;font-size:24px;height:90px;position:relative;color:#1b1b1b}
.tkhead .closex{position:absolute;right:-4px;top:16px;width:58px;height:58px;border-radius:50%;border:2px solid #b02a37;display:grid;place-items:center}
.ticket{background:#fff;border-radius:22px;position:relative;overflow:hidden}
.tk-top{display:flex;gap:18px;padding:22px 34px 18px 22px;position:relative}
.poster{width:96px;height:146px;border-radius:12px;flex:none;position:relative;overflow:hidden;background:linear-gradient(160deg,#1d3b2a,#4c7a3d 45%,#c9a24a);box-shadow:0 4px 10px rgba(0,0,0,.25);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.poster .pt{font-size:13px;font-weight:700;letter-spacing:2px;padding:12px 8px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.poster .wt{background:var(--red-dark);font-size:11px;text-align:center;padding:5px 0}
.poster .play{width:30px;height:30px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;margin:0 auto;background:rgba(0,0,0,.25)}
.tk-top h2{font-size:21px;font-weight:700;line-height:1.25}
.tk-top p{color:#666;font-size:15px;margin-top:10px}
.mtk{position:absolute;right:6px;top:70px;transform:rotate(-90deg);font-size:14px;color:#555;transform-origin:center}
.notch{position:absolute;width:20px;height:20px;border-radius:50%;background:#3b3b3b}
.tap{margin:0 22px;background:#f3f3f3;border-radius:14px;padding:13px;text-align:center;font-size:15px;width:calc(100% - 44px);display:block}
.tkd{text-align:center;padding:26px 0 0}
.tkd .n{color:#555;font-size:15px}
.tkd .scr{font-size:24px;margin:12px 0 4px;width:auto;height:auto}
.tkd .seats{color:#555;font-size:15px;padding:0 20px}
.qr{width:120px;height:120px;margin:18px auto 16px}
.tkd .bid{font-size:17px;font-weight:500;letter-spacing:.3px;padding-bottom:18px}
.cinfo{background:#f3f3f3;color:#555;font-size:14px;text-align:center;padding:12px 30px;line-height:1.5}
.support{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0 24px;color:#555;font-size:15px;margin:0 auto}
.dash{border-top:1px solid #aaa;margin:0 22px;position:relative}
.tktot{background:#f3f3f3;padding:14px 18px 18px}
.tktot .prow{color:#666;font-size:15px}
.tktot .prow:first-child{color:#222;font-size:15px}

/* ---------- split pay (payment page) ---------- */
.splitcard{background:#fff;margin:12px 0 0;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.splitcard h5{font-size:15px;font-weight:500;padding:14px 14px 6px}
.radio{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-top:1px solid #f0f0f0}
.radio:first-of-type{border-top:0}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid #bbb;flex:none;position:relative}
.radio.on i{border-color:var(--red-dark)}
.radio.on i:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--red-dark)}
.radio div{flex:1}.radio b{font-weight:500;font-size:15px;display:block}.radio small{font-size:12.5px;color:#777;display:block;margin-top:2px;line-height:1.35}
.radio > span{font-size:14px;font-weight:500}

function expSuggest(k){

  const cmin=Math.min(...gp.map(p=>p.c)), cmax=Math.max(...gp.map(p=>p.c));

  return Object.keys(POS).filter(id=>!POS[id].w&&!expTaken(id)&&samePrice(id)).sort((a,b)=>dist(a)-dist(b)).slice(0,k);
}
function lateSuggest(k){

/* ================= helpers ================= */
function qr(seed){
  let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>((h=(h*1664525+1013904223)>>>0)/4294967296);
  const n=25,inF=(x,y,ox,oy)=>x>=ox&&x<ox+8&&y>=oy&&y<oy+8;
  let out='';
  const finder=(ox,oy)=>`<rect x="${ox}" y="${oy}" width="7" height="7"/><rect x="${ox+1}" y="${oy+1}" width="5" height="5" fill="#fff"/><rect x="${ox+2}" y="${oy+2}" width="3" height="3"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(inF(x,y,0,0)||inF(x,y,17,0)||inF(x,y,0,17))continue;
    if(rnd()<.5)out+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return out+finder(0,0)+finder(18,0)+finder(0,18);
}

/* ---------- group booking: create, hold timer, simulated friends ---------- */
let holdT, simT=[];
function startGroup(){
  S.paidAmt=payAmount();
  S.linkId=Math.random().toString(36).slice(2,8).toUpperCase();
  S.holdEnd=Date.now()+HOLD_MIN*60000;
  S.shared=false;
  S.group=seatsSorted().map((seat,i)=>i===0
    ? {seat,name:ME+' (You)',status:'done',note:'Paid '+rupee(seatCost(seat))}
    : i<S.payFor
      ? {seat,name:'Covered by you',status:'done',note:'Paid by '+ME}
      : {seat,name:null,status:'wait',note:'Link not shared yet'});
  S.group.forEach(s=>s.mine=s.status==='done');
  clearInterval(holdT);
  holdT=setInterval(tickHold,1000);
  go('group'); tickHold();
}
function tickHold(){
  if(!S.group)return;
  const ms=S.holdEnd-Date.now();
  const el=document.getElementById('holdT');
  if(ms<=0){ // hold expired: release every unpaid seat
    clearInterval(holdT);
    S.group.forEach(s=>{if(s.status==='wait'){s.status='canc';s.note='Hold expired';}});
    if(S.screen==='group')render(); return;
  }
  if(el){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
}
function flashRow(s){
  s.flash=true;
  if(S.screen==='group'){render();tickHold();}
  setTimeout(()=>{s.flash=false;},1300);
}
/* A friend pays → they get the open seat closest to the already-paid block, so paid seats never have gaps. */
function friendPays(name){
  const s=S.group.find(x=>x.status==='wait'); if(!s)return;
  Object.assign(s,{status:'done',name,note:'Paid '+rupee(seatCost(s.seat))});
  toast(`${name} paid · got ${s.seat}`); flashRow(s);
}
/* A friend opts out → the open seat farthest from the group is released, so the block stays together. */
function friendOptsOut(){
  const open=S.group.filter(x=>x.status==='wait'); if(!open.length)return;
  const s=open[open.length-1];
  Object.assign(s,{status:'canc',note:'A friend opted out'});
  toast(`${s.seat} released back to the cinema`); flashRow(s);
}
/* demo: after the link is shared, friends pay or opt out (we only learn a name once they pay) */
function startSim(){
  if(S.shared)return; S.shared=true;
  S.group.forEach(s=>{if(s.status==='wait')s.note='Link shared · held till '+fmtTime(new Date(S.holdEnd));});
  if(S.screen==='group'){render();tickHold();}
  simT=[
    setTimeout(()=>friendPays(FRIENDS[0]),3000),
    setTimeout(()=>friendOptsOut(),6500),
    setTimeout(()=>friendPays(FRIENDS[2]),10000),
  ];
}

/* seat pick: auto-fill contiguous seats to the right (same block) like BMS */
function pickSeat(id){
  if(SOLD.has(id))return;
  if(S.sel.includes(id)){S.sel=S.sel.filter(s=>s!==id);return;}
  if(S.sel.length>=S.count) S.sel=[];
  const rowId=id[0];
  let row,cat;LAYOUT.forEach(c=>c.rows.forEach(r=>{if(r.id===rowId){row=r;cat=c;}}));
  if(S.sel.length && PRICE_OF[S.sel[0][0]].cat!==cat.cat) S.sel=[];
  const ids=row.cells.map((n,ci)=>n===0?null:n==='W'?rowId+(ci===13?5:4):rowId+n);
  let i=ids.indexOf(id);
  while(i<ids.length && ids[i] && S.sel.length<S.count && !SOLD.has(ids[i]) && !S.sel.includes(ids[i])){S.sel.push(ids[i]);i++;}
}

  shareTo:v=>{S.ov=null;renderOv();toast('Link sent via '+v);startSim();},
  copyLink:()=>{try{navigator.clipboard.writeText('https://bms.co/g/'+S.linkId);}catch(e){}S.ov=null;renderOv();toast('Link copied');startSim();},
  refresh:()=>{render();tickHold();const w=S.group.filter(s=>s.status==='wait').length;toast(w?`${w} seat${w>1?'s':''} still unpaid`:'All seats sorted');},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  e.preventDefault();A[el.dataset.a]?.(el.dataset.v,el);
});

/* clock */
const tick=()=>{const d=new Date();document.getElementById('clock').textContent=d.getHours()%12||12;document.getElementById('clock').textContent+=':'+String(d.getMinutes()).padStart(2,'0');};
tick();setInterval(tick,30000);
fit();
render();
</script>
</body>
